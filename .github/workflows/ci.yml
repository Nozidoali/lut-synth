name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the tools
        shell: bash
        run: |
          printf '0110100110010110\n' > parity.tt
          for method in ss davio dsd exact; do
            build/lut-synth-$method --input parity.tt --output parity.v
          done
          build/lut-resyn-anysyn --input parity.v --timeout 10
